name: Deploy static site to GitHub Pages

# 推送到 main 自动：测试 → 构建 → 发布静态站点到 GitHub Pages
# 使用内置 GITHUB_TOKEN 部署，无需配置任何仓库 Secret
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次 Pages 部署，新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

      # 项目页部署在 /<仓库名>/ 子路径下，base 必须带上该前缀（从 GITHUB_REPOSITORY 动态截取，fork 改名亦可直接用）
      - name: Build
        working-directory: frontend
        run: npm run build -- --base="/${GITHUB_REPOSITORY#*/}/"

      # GitHub Pages 不支持 SPA 路由回退，复制 index.html 为 404.html 让深链路由由前端接管
      - name: SPA fallback page
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
